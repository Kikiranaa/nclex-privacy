name: nca_nclex_cat
description: "New Careers Academy — NCLEX-RN CAT Simulator"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ──
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0

  # ── Security ──
  flutter_windowmanager: ^2.1.0       # FLAG_SECURE (Android screenshot block)
  no_screenshot: ^0.0.1+5             # Cross-platform screenshot prevention
  screenshot_callback: ^3.0.2         # iOS screenshot detection listener

  # ── Local Storage / Offline ──
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^5.0.2           # Network status detection
  path_provider: ^2.1.2

  # ── UI ──
  google_fonts: ^6.1.0
  fl_chart: ^0.66.2                   # Charts for results
  percent_indicator: ^4.2.3           # Circular/linear progress
  shimmer: ^3.0.0                     # Loading skeleton
  lottie: ^3.1.0                      # Animations (optional)

  # ── State Management ──
  provider: ^6.1.2

  # ── Utilities ──
  intl: ^0.19.0
  uuid: ^4.3.3
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/
